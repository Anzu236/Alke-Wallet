<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Movimientos | Alke Wallet</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light">

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="menu.html">
                Alke Wallet
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarWallet"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarWallet"
            >

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link"
                           href="menu.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="deposit.html">
                            Depositar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="withdraw.html">
                            Retirar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="sendmoney.html">
                            Enviar dinero
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                           href="transactions.html">
                            Movimientos
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- =========================
         CONTENIDO PRINCIPAL
    ========================== -->

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-lg-9">

                <!-- TÍTULO -->

                <div class="mb-4">

                    <h1 class="fw-bold">
                        Últimos movimientos
                    </h1>

                    <p class="text-muted">
                        Revisa el historial de operaciones de tu billetera.
                    </p>

                </div>


                <!-- SALDO -->

                <div class="card shadow-sm mb-4 saldo-resumen">

                    <div class="card-body">

                        <p class="text-muted mb-1">
                            Saldo disponible
                        </p>

                        <h2
                            id="saldoActual"
                            class="fw-bold text-primary"
                        >
                            $0
                        </h2>

                    </div>

                </div>


                <!-- FILTROS -->

                <div class="card shadow-sm mb-4 filter-card">

                    <div class="card-body">

                        <label
                            for="filtroTipo"
                            class="form-label fw-semibold"
                        >
                            Filtrar movimientos
                        </label>

                        <select
                            id="filtroTipo"
                            class="form-select"
                        >

                            <option value="todos">
                                Todos
                            </option>

                            <option value="deposito">
                                Depósitos
                            </option>

                            <option value="retiro">
                                Retiros
                            </option>

                            <option value="transferencia">
                                Transferencias
                            </option>

                        </select>

                    </div>

                </div>


                <!-- MENSAJE SIN MOVIMIENTOS -->

                <div
                    id="sinMovimientos"
                    class="alert alert-info d-none"
                >
                    Aún no tienes movimientos registrados.
                </div>


                <!-- LISTA DE MOVIMIENTOS -->

                <div id="listaMovimientos">

                </div>


                <!-- VOLVER -->

                <div class="d-grid mt-4">

                    <a
                        href="menu.html"
                        class="btn btn-outline-secondary"
                    >
                        Volver al menú
                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- jQuery -->
    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- Nuestro JavaScript -->
    <script src="js/transactions.js"></script>

</body>

</html>
