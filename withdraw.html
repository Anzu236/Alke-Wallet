<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Retirar dinero | Alke Wallet</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light">

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="menu.html">
                Alke Wallet
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarWallet"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarWallet"
            >

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link"
                           href="menu.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="deposit.html">
                            Depositar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                           href="withdraw.html">
                            Retirar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="sendmoney.html">
                            Enviar dinero
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="transactions.html">
                            Movimientos
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- =========================
         CONTENIDO
    ========================== -->

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">

                <!-- Saldo actual -->

                <div class="card shadow-sm mb-4 saldo-resumen">

                    <div class="card-body">

                        <p class="text-muted mb-1">
                            Saldo disponible
                        </p>

                        <h2
                            id="saldoActual"
                            class="fw-bold text-primary"
                        >
                            $0
                        </h2>

                    </div>

                </div>


                <!-- Formulario -->

                <div class="card shadow withdraw-card">

                    <div class="card-body p-4">

                        <h1 class="h3 fw-bold mb-2">
                            Retirar dinero
                        </h1>

                        <p class="text-muted mb-4">
                            Ingresa el monto que deseas retirar de tu billetera.
                        </p>


                        <!-- Mensajes -->

                        <div id="mensajeRetiro"></div>


                        <form id="withdrawForm">

                            <div class="mb-3">

                                <label
                                    for="montoRetiro"
                                    class="form-label"
                                >
                                    Monto a retirar
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        $
                                    </span>

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="montoRetiro"
                                        placeholder="Ej: 20000"
                                        min="1"
                                        step="1"
                                        required
                                    >

                                </div>

                                <div class="form-text">
                                    El monto no puede superar tu saldo disponible.
                                </div>

                            </div>


                            <div class="d-grid gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Realizar retiro
                                </button>

                                <a
                                    href="menu.html"
                                    class="btn btn-outline-secondary"
                                >
                                    Volver al menú
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- jQuery -->
    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>

    <!-- JS propio -->
    <script src="js/withdraw.js"></script>

</body>

</html>
