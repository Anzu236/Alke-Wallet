<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enviar dinero | Alke Wallet</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light">

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="menu.html">
                Alke Wallet
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarWallet"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarWallet"
            >

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link"
                           href="menu.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="deposit.html">
                            Depositar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="withdraw.html">
                            Retirar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active"
                           href="sendmoney.html">
                            Enviar dinero
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="transactions.html">
                            Movimientos
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- =========================
         CONTENIDO
    ========================== -->

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-lg-8">

                <!-- SALDO -->

                <div class="card shadow-sm mb-4 saldo-resumen">

                    <div class="card-body">

                        <p class="text-muted mb-1">
                            Saldo disponible
                        </p>

                        <h2
                            id="saldoActual"
                            class="fw-bold text-primary"
                        >
                            $0
                        </h2>

                    </div>

                </div>


                <!-- TARJETA PRINCIPAL -->

                <div class="card shadow sendmoney-card">

                    <div class="card-body p-4">

                        <div
                            class="d-flex flex-column flex-md-row
                                   justify-content-between
                                   align-items-md-center
                                   gap-3 mb-4"
                        >

                            <div>

                                <h1 class="h3 fw-bold mb-1">
                                    Enviar dinero
                                </h1>

                                <p class="text-muted mb-0">
                                    Busca un contacto y realiza una transferencia.
                                </p>

                            </div>


                            <!-- ABRIR MODAL -->

                            <button
                                class="btn btn-outline-primary"
                                data-bs-toggle="modal"
                                data-bs-target="#modalContacto"
                            >
                                + Agregar contacto
                            </button>

                        </div>


                        <!-- MENSAJES -->

                        <div id="mensajeTransferencia"></div>


                        <!-- =========================
                             BUSCAR CONTACTO
                        ========================== -->

                        <div class="mb-4 position-relative">

                            <label
                                for="buscarContacto"
                                class="form-label"
                            >
                                Buscar contacto
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="buscarContacto"
                                placeholder="Escribe el nombre, correo o alias"
                                autocomplete="off"
                            >


                            <!-- Resultados del autocompletado -->

                            <div
                                id="sugerenciasContactos"
                                class="list-group position-absolute w-100 shadow-sm"
                            >
                            </div>

                        </div>


                        <!-- CONTACTO SELECCIONADO -->

                        <div
                            id="contactoSeleccionado"
                            class="alert alert-light border d-none"
                        >
                        </div>


                        <!-- =========================
                             FORMULARIO TRANSFERENCIA
                        ========================== -->

                        <form id="transferForm">

                            <div class="mb-3">

                                <label
                                    for="montoTransferencia"
                                    class="form-label"
                                >
                                    Monto a transferir
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        $
                                    </span>

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="montoTransferencia"
                                        placeholder="Ej: 10000"
                                        min="1"
                                        step="1"
                                        required
                                    >

                                </div>

                            </div>


                            <div class="d-grid gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Realizar transferencia
                                </button>

                                <a
                                    href="menu.html"
                                    class="btn btn-outline-secondary"
                                >
                                    Volver al menú
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- =========================
         MODAL NUEVO CONTACTO
    ========================== -->

    <div
        class="modal fade"
        id="modalContacto"
        tabindex="-1"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h2 class="modal-title fs-5">
                        Agregar nuevo contacto
                    </h2>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    >
                    </button>

                </div>


                <div class="modal-body">

                    <div id="mensajeContacto"></div>


                    <form id="contactForm">

                        <div class="mb-3">

                            <label
                                for="nombreContacto"
                                class="form-label"
                            >
                                Nombre
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nombreContacto"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="correoContacto"
                                class="form-label"
                            >
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="correoContacto"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="aliasContacto"
                                class="form-label"
                            >
                                Alias
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="aliasContacto"
                                placeholder="Ej: maria.wallet"
                                required
                            >

                        </div>


                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Guardar contacto
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- jQuery -->
    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- JavaScript propio -->
    <script src="js/sendmoney.js"></script>

</body>

</html>
